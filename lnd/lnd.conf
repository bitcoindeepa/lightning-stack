[Application Options]
alias=BitcoinDeepaNode
color=#F7931A
debuglevel=info
maxpendingchannels=5

# Listen on all interfaces so Railway private networking + TCP proxy can reach LND.
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080

# TLS cert must be valid for the hostname other Railway services use to reach LND.
# Railway private DNS = <service-name>.railway.internal. If you name the service
# "lnd", the line below is correct. Add another tlsextradomain for the public
# TCP-proxy host if you want to reach REST from outside (Phase 1 wallet creation).
tlsextradomain=lnd.railway.internal

# Neutrino has no local Bitcoin node, so it needs an external fee source.
feeurl=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json

# AUTO-UNLOCK: keep commented for FIRST boot (so we create the wallet and capture
# the seed). Uncomment in Phase 1 step 6 once the wallet exists.
# wallet-unlock-password-file=/data/walletpassword.txt

[Bitcoin]
bitcoin.active=true
bitcoin.mainnet=true
bitcoin.node=neutrino

[neutrino]
# Optional peers for faster/steadier sync. LND can also auto-discover.
neutrino.addpeer=btcd-mainnet.lightning.computer
neutrino.addpeer=mainnet.lightning.computer
