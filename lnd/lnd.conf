[Application Options]
alias=BitcoinDeepa ⚡
color=#F7931A
debuglevel=info

# --- Listeners -------------------------------------------------------------
# MUST be [::] and not 0.0.0.0. Railway's private network is IPv6-ONLY, so
# lnd.railway.internal resolves to an fd12::/16 address. Binding 0.0.0.0 listens
# on IPv4 only, and ThunderHub/LNbits get ECONNREFUSED against that IPv6 address.
# Railway's TCP proxy reaches the container the same way, so 9735 needs it too.
# On Linux, [::] accepts IPv4 connections as well (bindv6only=0), so this is
# strictly wider than 0.0.0.0 - there is no reason to list both.
listen=[::]:9735
rpclisten=[::]:10009
restlisten=[::]:8080

# --- TLS -------------------------------------------------------------------
# tlsdisableautofill keeps the container's ephemeral IP OUT of the certificate.
# Without it LND regenerates tls.cert every time Railway hands the container a
# new IP, which would invalidate the cert hex/base64 pasted into LNbits and
# ThunderHub and silently break both.
tlsdisableautofill=true
# The cert must carry the lnd service's ACTUAL RAILWAY_PRIVATE_DOMAIN. Both
# names are listed because this project has already moved between them once;
# extra SANs cost nothing and a mismatch here is tedious to diagnose (it shows
# up as a TLS hostname error in ThunderHub/LNbits, not as anything about DNS).
# Check the real value in Railway → lnd service → Variables.
tlsextradomain=lnd.railway.internal
tlsextradomain=bitcoindeepa-lightning-stack.railway.internal

# --- Wallet ----------------------------------------------------------------
# start.sh writes this file from the WALLET_PASSWORD Railway secret on boot.
wallet-unlock-password-file=/data/walletpassword.txt
# wallet-unlock-allow-create is deliberately NOT set here. start.sh passes it as
# a CLI flag only while ALLOW_WALLET_CREATE=1, because in that state LND's wallet
# creation RPC is UNAUTHENTICATED. Phase 1 only - remove the variable after the
# wallet exists. See DEPLOY.md.

# --- Channels --------------------------------------------------------------
maxpendingchannels=5
# Reject dust channels that cost more to close than they can ever carry.
minchansize=100000
accept-keysend=true
accept-amp=true

# --- Housekeeping ----------------------------------------------------------
# LNbits generates a lot of invoices; drop the cancelled ones so the db stays small.
gc-canceled-invoices-on-startup=true
# Compact channel.db so the 5 GB volume does not slowly fill up.
db.bolt.auto-compact=true
db.bolt.auto-compact-min-age=168h
logging.file.max-files=3
logging.file.max-file-size=20

[fee]
# Neutrino has no local Bitcoin node, so on-chain fee estimation needs an
# external URL. This is REQUIRED for neutrino on mainnet - LND will not start
# without a reachable one. (The old top-level "feeurl" key is deprecated.)
#
# The response must be in LND's own format:
#   {"fee_by_block_target": {"1": 12345, "3": 8000, "6": 5000}}
# so an arbitrary fee API cannot be substituted here.
fee.url=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json

[Bitcoin]
bitcoin.active=true
bitcoin.mainnet=true
bitcoin.node=neutrino

# Forwarding policy: 1 sat base + 200 ppm. Earns a little on any routing that
# comes our way without pricing us out. Total = basefee + amount*feerate/1e6.
bitcoin.basefee=1000
bitcoin.feerate=200
bitcoin.timelockdelta=80

[protocol]
protocol.wumbo-channels=true
protocol.option-scid-alias=true

[routing]
# A light client cannot fetch funding outputs itself, so it cannot fully verify
# channel funding transactions. Standard and required for Neutrino.
routing.assumechanvalid=true

[neutrino]
# Public Neutrino-serving peers. LND also auto-discovers; these just make the
# initial filter-header sync faster and steadier. Safe to remove any that go down.
neutrino.addpeer=btcd-mainnet.lightning.computer
neutrino.addpeer=mainnet.lightning.computer
neutrino.addpeer=bb1.breez.technology
neutrino.addpeer=bb2.breez.technology
